spring:
  application:
    name: court-booking
  datasource:
    url: jdbc:postgresql://localhost:5433/courtbooking
    username: courtbooking
    password: courtbooking
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway, Hibernate solo comprueba
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8081