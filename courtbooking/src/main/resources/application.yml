spring:
  application:
    name: court-booking
  datasource:
    url: jdbc:postgresql://localhost:5433/courtbooking
    username: courtbooking
    password: courtbooking
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway, Hibernate solo comprueba
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion}
    expiration-minutes: 60
  admin:
    email: admin@courtbooking.local
    password: ${ADMIN_PASSWORD:admin1234}
  booking:
    zone: Europe/Madrid
    opening-time: "08:00"
    closing-time: "22:00"
    max-days-in-advance: 7
    max-active-bookings: 3
    cancellation-hours: 24
    lighting-from: "19:00"
    lighting-supplement-per-hour: "3.00"